<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Sekiller Dunyasi</title>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>

<script src="three.min.js"></script>

<script>
  // ---- Ders 1'den tanidik: sahne, kamera, cizici ----
  const sahne = new THREE.Scene();
  sahne.background = new THREE.Color(0x0b1d3a);

  const kamera = new THREE.PerspectiveCamera(
    75, window.innerWidth / window.innerHeight, 0.1, 1000
  );
  kamera.position.set(0, 2, 10);   // x, y, z: biraz yukarida ve geride
  kamera.lookAt(0, 0, 0);          // sahnenin ortasina bak

  const cizici = new THREE.WebGLRenderer();
  cizici.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(cizici.domElement);

  // ---- Her nesne icin ayni malzeme ----
  const malzeme = new THREE.MeshNormalMaterial();

  // ---- 1) KUP (hazir) ----
  const kup = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), malzeme);
  kup.position.x = -4.5;           // sola koy
  sahne.add(kup);

  // ---- GOREV 1: KURE ekle ----
  // Ipucu: SphereGeometry(1.2, 32, 32), position.x = -1.5

  // ---- GOREV 2: SILINDIR ekle ----
  // Ipucu: CylinderGeometry(1, 1, 2.5, 32), position.x = 1.5

  // ---- GOREV 3: HALKA ekle ----
  // Ipucu: TorusGeometry(1, 0.4, 16, 48), position.x = 4.5

  // ---- GOREV 4 (bonus): ZEMIN ekle ----
  // Ipucu: tam kodda (index.html) bak, ama once kendin dene

  // ---- Animasyon ----
  function ciz() {
    requestAnimationFrame(ciz);
    kup.rotation.y += 0.01;
    // Eklediklerin icin de buraya birer satir yaz
    cizici.render(sahne, kamera);
  }
  ciz();
</script>

</body>
</html>
